[pytest]
# Набор по умолчанию собирает только открытую часть: каталог tests.
testpaths = tests
addopts = -q -p no:cacheprovider
markers =
    foreign_name: тест берёт имена чужой программы из tests/foreign.py; их можно подменить переменными окружения, и тогда тот же тест проверяет то же свойство на другом имени
